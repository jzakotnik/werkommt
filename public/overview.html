<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Übersicht Absagen – Werkommt?</title>
  <meta name="description" content="Übersicht aller Trainings-Absagen nach Trainer.">
  <meta name="theme-color" content="#f46b1b">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon"        href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16"  href="/icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32"  href="/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="96x96"  href="/icons/icon-96.png">
  <link rel="icon" type="image/svg+xml"        href="/icons/icon.svg">
  <link rel="apple-touch-icon"                 href="/icons/apple-touch-icon.png">
  <link rel="manifest"                         href="/manifest.json">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://werkommt.derjure.de/overview.html">
  <meta property="og:title"       content="Werkommt? – TT Training Absagen">
  <meta property="og:description" content="Übersicht aller Absagen für das nächste Jugendtraining.">
  <meta property="og:image"       content="https://werkommt.derjure.de/icons/og-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale"     content="de_DE">

  <!-- Twitter/X Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Werkommt? – TT Training Absagen">
  <meta name="twitter:description" content="Übersicht aller Absagen für das nächste Jugendtraining.">
  <meta name="twitter:image"       content="https://werkommt.derjure.de/icons/og-preview.png">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23f46b1b'/><text y='.9em' font-size='80' x='12'>🏓</text></svg>">
</head>
<body>
<div class="page">

  <!-- Header -->
  <header class="site-header">
    <div class="header-top">
      <div class="ball-icon">🏓</div>
      <div class="club-name" id="clubName">TT-<span>Verein</span></div>
    </div>
    <div class="club-subtitle" id="clubSubtitle">Jugendtraining · Absagen</div>
  </header>

  <!-- Nav -->
  <nav class="nav-tabs">
    <a  class="nav-tab" href="index.html">✏️ Absage eintragen</a>
    <span class="nav-tab active">📋 Übersicht</span>
  </nav>

  <!-- Next Training Banner -->
  <div class="training-banner">
    <div class="icon">📅</div>
    <div>
      <div class="label">Absagen für</div>
      <div class="date" id="nextTrainingDate">Lädt…</div>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="statTotal">–</div>
      <div class="stat-label">Absagen gesamt</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statTrainers">–</div>
      <div class="stat-label">Trainer betroffen</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statLast">–</div>
      <div class="stat-label">Letzte Absage</div>
    </div>
  </div>

  <!-- Overview Header -->
  <div class="overview-header">
    <div class="overview-title">Absagen nach Trainer</div>
    <div class="refresh-indicator">
      <div class="refresh-dot"></div>
      <span>Aktualisiert alle 30 Sek.</span>
    </div>
  </div>

  <!-- Trainer Sections -->
  <div id="trainerSections">
    <!-- populated by JS -->
  </div>

  <!-- Reset Info -->
  <div class="reset-info" id="resetInfo">
    <span>🔄</span>
    <span id="resetText">Lädt…</span>
    <button class="btn-danger" id="btnManualReset" onclick="manualReset()">Reset</button>
  </div>

</div><!-- .page -->

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Footer -->
<footer class="site-footer">
  Made with ♥ by <a href="https://github.com/jzakotnik/werkommt" target="_blank" rel="noopener">Jure</a>
</footer>

<script>
let trainers = [];
let refreshTimer = null;

async function init() {
  try {
    const res = await fetch('/api/config');
    const cfg = await res.json();

    document.getElementById('clubName').innerHTML =
      cfg.club.name.replace(/\s+(\S+)$/, ' <span>$1</span>');
    document.getElementById('clubSubtitle').textContent = cfg.club.subtitle || 'Jugendtraining · Absagen';

    const parts = cfg.nextTraining.displayStr.split(' ');
    document.getElementById('nextTrainingDate').innerHTML =
      `<em>${parts[0]}</em> ${parts.slice(1).join(' ')}`;

    trainers = cfg.trainers;
    await loadAbsagen();
  } catch (e) {
    showToast('⚠️ Fehler beim Laden');
  }
}

async function loadAbsagen() {
  try {
    const res = await fetch('/api/absagen');
    const data = await res.json();

    // Stats
    document.getElementById('statTotal').textContent = data.total;
    const affected = trainers.filter(t => (data.byTrainer[t.id] || []).length > 0).length;
    document.getElementById('statTrainers').textContent = affected;

    if (data.all.length > 0) {
      const latest = new Date(data.all[0].timestamp);
      document.getElementById('statLast').textContent = latest.toLocaleTimeString('de-DE', {
        hour: '2-digit', minute: '2-digit'
      });
    } else {
      document.getElementById('statLast').textContent = '–';
    }

    // Render trainer sections
    const container = document.getElementById('trainerSections');
    container.innerHTML = trainers.map(trainer => {
      const absagen = data.byTrainer[trainer.id] || [];
      const initials = trainer.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

      const items = absagen.length > 0
        ? absagen.map(a => {
            const time = new Date(a.timestamp).toLocaleTimeString('de-DE', {
              hour: '2-digit', minute: '2-digit'
            });
            return `
              <div class="absage-item">
                <div>
                  <div class="absage-name">🧒 ${escHtml(a.kindName)}</div>
                </div>
                <div class="absage-time">eingetragen ${time} Uhr</div>
              </div>`;
          }).join('')
        : `<div class="empty-state">Keine Absagen für dieses Training</div>`;

      return `
        <div class="trainer-section">
          <div class="trainer-section-header">
            <div class="trainer-section-avatar">${initials}</div>
            <div class="trainer-section-name">${escHtml(trainer.name)}</div>
            <div class="trainer-badge ${absagen.length === 0 ? 'zero' : ''}">${absagen.length}</div>
          </div>
          <div class="absagen-list">${items}</div>
        </div>`;
    }).join('');

    // Reset info
    const lastReset = new Date(data.lastReset);
    document.getElementById('resetText').textContent =
      `Zuletzt zurückgesetzt: ${lastReset.toLocaleDateString('de-DE', {
        weekday: 'short', day: '2-digit', month: '2-digit'
      })} um ${lastReset.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr`;

  } catch (e) {
    showToast('⚠️ Fehler beim Laden der Absagen');
  }
}

async function manualReset() {
  if (!confirm('Wirklich alle Absagen zurücksetzen?')) return;
  try {
    await fetch('/api/absagen', { method: 'DELETE' });
    showToast('✅ Alle Absagen zurückgesetzt');
    loadAbsagen();
  } catch {
    showToast('⚠️ Fehler beim Zurücksetzen');
  }
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Auto-refresh every 30s
document.addEventListener('DOMContentLoaded', () => {
  init();
  setInterval(loadAbsagen, 30000);
});
</script>
</body>
</html>
