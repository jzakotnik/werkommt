<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a3a7a"/>
      <stop offset="100%" stop-color="#060e28"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </radialGradient>
    <linearGradient id="paddle-blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#00000088"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Ring -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#93c5fd" stroke-width="2.5" opacity="0.18"/>

  <!-- Paddle handle -->
  <rect x="295" y="335" width="26" height="108" rx="13"
        fill="#7c5c1e" filter="url(#shadow)" transform="rotate(-35 308 389)"/>

  <!-- Paddle blade -->
  <ellipse cx="218" cy="270" rx="108" ry="118"
           fill="url(#paddle-blade)" filter="url(#shadow)" transform="rotate(-35 218 270)"/>
  <ellipse cx="218" cy="270" rx="88" ry="98"
           fill="#3b82f6" opacity="0.7" transform="rotate(-35 218 270)"/>
  <!-- Paddle grip line -->
  <line x1="170" y1="215" x2="268" y2="328"
        stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-linecap="round"/>

  <!-- Ball -->
  <circle cx="335" cy="183" r="75" fill="url(#ball)" filter="url(#glow)"/>
  <!-- Ball shine -->
  <circle cx="312" cy="160" r="24" fill="white" opacity="0.5"/>
  <!-- Ball seam -->
  <path d="M 283 172 Q 335 149 385 177"
        stroke="#1a56db" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round"/>
</svg>