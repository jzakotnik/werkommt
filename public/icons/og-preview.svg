<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a1628"/>
      <stop offset="50%"  stop-color="#060e28"/>
      <stop offset="100%" stop-color="#050b20"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#1a56db" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a56db" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </radialGradient>
    <linearGradient id="paddle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow-ball">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Diagonal stripes -->
  <g opacity="0.035" stroke="white" stroke-width="1">
    <line x1="-100" y1="0" x2="630" y2="730"/>
    <line x1="50"   y1="0" x2="780" y2="730"/>
    <line x1="200"  y1="0" x2="930" y2="730"/>
    <line x1="350"  y1="0" x2="1080" y2="730"/>
    <line x1="500"  y1="0" x2="1230" y2="730"/>
    <line x1="650"  y1="0" x2="1380" y2="730"/>
    <line x1="800"  y1="0" x2="1530" y2="730"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="7" height="630" fill="#1a56db"/>
  <rect x="0" y="0" width="7" height="210" fill="#93c5fd"/>

  <!-- Right decorative large glow circle -->
  <circle cx="960" cy="315" r="260" fill="#1a56db" opacity="0.06"/>
  <circle cx="960" cy="315" r="180" fill="#1a56db" opacity="0.05"/>

  <!-- Paddle -->
  <g transform="translate(820,220) rotate(-25)">
    <!-- handle -->
    <rect x="55" y="185" width="24" height="105" rx="12" fill="#7c5c1e" opacity="0.9"/>
    <!-- blade -->
    <ellipse cx="70" cy="118" rx="95" ry="105" fill="url(#paddle)"/>
    <ellipse cx="70" cy="118" rx="76" ry="84" fill="#3b82f6" opacity="0.65"/>
    <line x1="28" y1="65" x2="112" y2="175" stroke="rgba(255,255,255,0.18)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Ball -->
  <circle cx="1010" cy="175" r="95" fill="url(#ball)" filter="url(#glow-ball)"/>
  <circle cx="984"  cy="149" r="30" fill="white" opacity="0.45"/>
  <path d="M 940 168 Q 1010 142 1078 172" stroke="#1a56db" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Small decorative balls -->
  <circle cx="1130" cy="75"  r="22" fill="#dbeafe" opacity="0.09"/>
  <circle cx="1170" cy="130" r="13" fill="#93c5fd" opacity="0.07"/>

  <!-- Text: label -->
  <text x="78" y="198" font-family="Arial Black, sans-serif"
        font-size="20" font-weight="900" fill="#93c5fd" letter-spacing="7" opacity="0.9">TISCHTENNIS</text>

  <!-- Text: main title -->
  <text x="74" y="305" font-family="Arial Black, sans-serif"
        font-size="98" font-weight="900" fill="url(#title-grad)" letter-spacing="-2">WER</text>
  <text x="74" y="408" font-family="Arial Black, sans-serif"
        font-size="98" font-weight="900" fill="#93c5fd" letter-spacing="-2">KOMMT?</text>

  <!-- Subtitle -->
  <text x="80" y="470" font-family="Arial, sans-serif"
        font-size="26" fill="rgba(255,255,255,0.45)" letter-spacing="0.5">Training-Absagen leicht gemacht</text>

  <!-- Domain -->
  <text x="80" y="558" font-family="Arial, sans-serif"
        font-size="19" fill="rgba(255,255,255,0.22)" letter-spacing="2">werkommt.derjure.de</text>

  <!-- Bottom lines -->
  <rect x="0" y="614" width="1200" height="3" fill="#1a56db" opacity="0.6"/>
  <rect x="0" y="617" width="420" height="2" fill="#93c5fd" opacity="0.25"/>
</svg>